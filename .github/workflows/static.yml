name: Deploy My Account prototype to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: My Account/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: My Account
        run: pnpm install --frozen-lockfile
      - name: Build prototype
        working-directory: My Account
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Include models base prototype
        run: |
          mkdir -p "My Account/dist/models base"
          cp -R "models base/." "My Account/dist/models base/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'My Account/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
